<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Augur</title><link rel="stylesheet" href="/assets/style.css"><script src="/assets/lucide.min.js" defer></script><script src="/assets/i18n.js" defer></script><script src="/assets/app.js" defer></script></head>
<body>
<aside id="sidebar"><div class="brand"><svg class="lituus" viewBox="0 0 32 32" aria-hidden="true"><path d="M25 30V12A9 9 0 0 0 7 12A6 6 0 0 0 19 12A3 3 0 0 0 13 12"/></svg>Augur<span>QUASAR 27B</span></div><button id="new-chat" class="new-chat"><i data-lucide="square-pen"></i><span data-i18n="new_chat">新对话</span></button><nav id="chats" data-i18n-label="conversations" aria-label="对话列表"></nav><div class="sidebar-footer"><span class="status-dot"></span><span data-i18n="local_gpu">本机 GPU</span> <span class="experimental" data-i18n="experimental">实验性</span></div></aside>
<main>
<header><button id="menu" class="icon mobile" data-i18n-title="conversations" title="对话列表" aria-label="对话列表"><i data-lucide="panel-left"></i></button><div><strong id="chat-title">新对话</strong><span id="model">Augur</span></div><div class="header-actions"><span id="status" role="status" data-i18n="connecting">正在连接</span><button id="export" class="icon" data-i18n-title="export" title="导出对话" aria-label="导出对话"><i data-lucide="download"></i></button><button id="settings-button" class="icon" data-i18n-title="settings" title="设置" aria-label="设置"><i data-lucide="settings-2"></i></button></div></header>
<section id="messages" data-i18n-label="conversation" aria-label="对话内容" aria-live="polite"></section>
<div class="compose-area"><div id="error" role="alert" hidden></div><div id="attachments"></div><form id="composer"><textarea id="prompt" rows="2" data-i18n-label="message" aria-label="消息" data-i18n-ph="placeholder" placeholder="给 Augur 发消息" required></textarea><div class="compose-controls"><div class="left-controls"><button type="button" id="attach" class="icon" data-i18n-title="attach" title="添加图片" aria-label="添加图片"><i data-lucide="paperclip"></i></button><input id="files" type="file" accept="image/png,image/jpeg" multiple hidden><label class="tools-toggle"><input type="checkbox" id="tools"><span data-i18n="tools">工具</span></label><label class="tools-toggle"><input type="checkbox" id="thinking"><span data-i18n="think">思考</span></label><select id="detail" data-i18n-label="image_detail" aria-label="图片细节"><option value="auto" data-i18n="detail_auto">自动</option><option value="high" data-i18n="detail_high">高</option><option value="low" data-i18n="detail_low">低</option></select></div><div class="right-controls"><span id="bill"></span><button type="button" id="stop" class="icon stop" data-i18n-title="stop" title="停止生成" aria-label="停止生成" hidden><i data-lucide="square"></i></button><button type="submit" id="send" class="icon send" data-i18n-title="send" title="发送" aria-label="发送"><i data-lucide="arrow-up"></i></button></div></div></form></div>
</main>
<dialog id="settings"><form method="dialog"><h2 data-i18n="settings">设置</h2><label><span data-i18n="api_key">API Key</span><input type="password" id="api-key" autocomplete="off"></label><label><span data-i18n="output_tokens">输出 token 上限</span><input type="number" id="budget" min="1" step="1" value="1024"></label><label><span data-i18n="thinking_language">思考语言</span><select id="thinking-language"><option value="en" selected data-i18n="thinking_en">英文（默认）</option><option value="zh" data-i18n="thinking_zh">中文</option></select></label><label><span data-i18n="ui_language">界面语言</span><select id="ui-language"><option value="zh-CN">简体中文</option><option value="en">English</option></select></label><div class="settings-actions"><button type="button" id="stop-service" class="danger" data-i18n="stop_service">关闭服务</button><button type="submit" data-i18n="done">完成</button></div></form></dialog>
</body></html>
