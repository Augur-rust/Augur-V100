name: Public source checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: source-checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  windows-cpu:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - name: Install source-test dependencies
        run: python -m pip install --disable-pip-version-check -r container/augur/requirements.in
      - name: Protocol, UI, launcher and repository checks (CPU only)
        run: python -X utf8 -B scripts/check_augur_source.py
